!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Dépanne</title>
<style>
body{font:16px/1.5 system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;background:#f5f6f2;color:#17212b}
h1{font-size:2rem;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
input,select,textarea,button{font:inherit;padding:10px;border-radius:10px;border:1.5px solid #c9cfc8;box-sizing:border-box}
button{background:#0e5a8a;color:#fff;border:0;font-weight:600;cursor:pointer}
button.alt{background:#e7ecef;color:#17212b}
.card{background:#fff;border:1.5px solid #dde1dc;border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0}
.sub{color:#5d6b78;font-size:.92rem}
.ok{color:#1f7a45;font-weight:600}
dialog{border:0;border-radius:16px;padding:18px;width:min(420px,92%)}
dialog input,dialog textarea,#reg input,#reg select{display:block;width:100%;margin:8px 0}
#reg{display:none}
</style>
</head>
<body>
<h1>Un technicien, tout de suite.</h1>
<div class='row'>
  <button id='tabS' type='button'>Chercher</button>
  <button id='tabR' class='alt' type='button'>Je suis technicien</button>
</div>

<section id='search'>
  <div class='row'>
    <input id='q' type='search' placeholder='Ex. : fuite d’eau, ordinateur lent…' style='flex:1;min-width:180px'>
    <select id='trade'><option value=''>Tous les métiers</option></select>
  </div>
  <div class='row'>
    <button id='geo' type='button'>📍 Autour de moi</button>
    <select id='radius'>
      <option value='0'>Rayon illimité</option>
      <option value='2'>2 km</option>
      <option value='5'>5 km</option>
      <option value='10'>10 km</option>
      <option value='25'>25 km</option>
    </select>
    <select id='quart'></select>
  </div>
  <label><input id='now' type='checkbox' style='display:inline;width:auto'> Disponible maintenant</label>
  <p class='sub' id='geomsg' role='status'></p>
  <div id='list'></div>
</section>

<section id='reg'>
  <h2>Je suis technicien</h2>
  <p class='sub'>Remplissez votre profil pour apparaître dans les recherches.</p>
  <input id='rname' placeholder='Nom complet'>
  <select id='rtrade'></select>
  <input id='rphone' type='tel' placeholder='Téléphone'>
  <select id='rquart'></select>
  <input id='rtags' placeholder='Mots-clés : fuite, robinet, chauffe-eau'>
  <select id='rprice'><option value='1'>€ (économique)</option><option value='2' selected>€€ (moyen)</option><option value='3'>€€€ (premium)</option></select>
  <button id='rgeo' class='alt' type='button'>📍 Utiliser ma position exacte</button>
  <p class='sub' id='rgeomsg' role='status'>Sinon, la position du quartier choisi sera utilisée.</p>
  <button id='rsave' type='button'>M’inscrire</button>
  <p id='rmsg' role='status'></p>
</section>

<dialog id='dlg'>
  <h3 id='dt'></h3>
  <input id='cn' placeholder='Votre prénom'>
  <input id='cp' type='tel' placeholder='Votre téléphone'>
  <textarea id='cm' placeholder='Décrivez le problème'></textarea>
  <div class='row'><button id='send' type='button'>Envoyer la demande</button><button id='cancel' class='alt' type='button'>Annuler</button></div>
  <p id='dmsg' class='sub'></p>
</dialog>

<script>
const $ = id => document.getElementById(id);
const TRADES = ['Plomberie','Électricité','Informatique','Climatisation','Serrurerie','Électroménager','Mécanique auto','Peinture','Menuiserie','Réseau & TV'];
const Q = [['Centre-ville',0.3901,9.4544],['Glass',0.3985,9.4510],['Louis',0.3870,9.4490],['Akébé',0.3700,9.4750],['Nzeng-Ayong',0.4400,9.4950],['Owendo',0.2930,9.5000],['Akanda',0.5100,9.3500],['Angondjé',0.4650,9.4850],['Mont-Bouët',0.3910,9.4640],['Batterie IV',0.4200,9.4400]];
const SEED = [
 ['Karim Benali','Plomberie',0,1,1,'fuite robinet chauffe-eau'],
 ['Sophie Martin','Électricité',3,2,1,'panne prise disjoncteur'],
 ['Yacine Okoye','Informatique',4,2,0,'ordinateur virus wifi'],
 ['Laura Dupont','Climatisation',5,3,1,'clim froid entretien'],
 ['Mamadou Diallo','Serrurerie',1,2,1,'clé porte verrou'],
 ['Inès Haddad','Électroménager',8,1,0,'lave-linge frigo four'],
 ['Paul Renaud','Mécanique auto',7,2,0,'voiture frein batterie'],
 ['Nadia Cherif','Peinture',6,2,0,'mur plafond'],
 ['Omar Traoré','Menuiserie',2,3,0,'porte meuble fenêtre'],
 ['Julie Perret','Réseau & TV',9,1,1,'antenne internet fibre'],
 ['Hugo Lambert','Plomberie',5,2,0,'wc douche fuite'],
 ['Samira Belkacem','Informatique',0,1,1,'imprimante téléphone écran']
];
const base = SEED.map((s, i) => ({
  id: 'd' + i, name: s[0], trade: s[1], quartier: Q[s[2]][0],
  lat: Q[s[2]][1] + (i % 3 - 1) * 0.004, lng: Q[s[2]][2] + (i % 2 - 0.5) * 0.004,
  price: s[3], now: !!s[4], tags: s[5]
}));

const load = k => { try { return JSON.parse(localStorage.getItem(k)) || []; } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const rad = x => x * Math.PI / 180;
function hav(a, b, c, d) {
  const h = Math.sin(rad(c - a) / 2) ** 2 + Math.cos(rad(a)) * Math.cos(rad(c)) * Math.sin(rad(d - b) / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

let pos = null, rpos = null, current = null;

for (const t of TRADES) { $('trade').add(new Option(t, t)); $('rtrade').add(new Option(t, t)); }
$('quart').add(new Option('Mon quartier…', ''));
Q.forEach((q, i) => { $('quart').add(new Option(q[0], i)); $('rquart').add(new Option(q[0], i)); });

function render() {
  const q = $('q').value.toLowerCase(), tr = $('trade').value, r = +$('radius').value;
  let L = base.concat(load('techs')).map(t => ({ ...t, d: pos ? hav(pos.lat, pos.lng, t.lat, t.lng) : null }));
  if (tr) L = L.filter(t => t.trade === tr);
  if ($('now').checked) L = L.filter(t => t.now);
  if (q) L = L.filter(t => (t.name + ' ' + t.trade + ' ' + t.quartier + ' ' + t.tags).toLowerCase().includes(q));
  if (pos && r) L = L.filter(t => t.d <= r);
  if (pos) L.sort((a, b) => a.d - b.d);
  const box = $('list');
  box.textContent = '';
  if (!L.length) { box.textContent = 'Aucun technicien trouvé. Essayez un autre métier ou un rayon plus grand.'; return; }
  for (const t of L) {
    const card = document.createElement('article');
    card.className = 'card';
    const h = document.createElement('h3');
    h.textContent = t.name;
    const s = document.createElement('div');
    s.className = 'sub';
    s.textContent = t.trade + ' · ' + t.quartier + (t.d != null ? ' · ' + t.d.toFixed(1) + ' km' : '') + ' · ' + '€'.repeat(t.price);
    const a = document.createElement('div');
    a.className = t.now ? 'ok' : 'sub';
    a.textContent = t.now ? 'Disponible maintenant' : 'Disponible aujourd’hui';
    const b = document.createElement('button');
    b.textContent = 'Demander une intervention';
    b.onclick = () => { current = t; $('dt').textContent = 'Contacter ' + t.name; $('dmsg').textContent = ''; $('dlg').showModal(); };
    card.append(h, s, a, b);
    box.append(card);
  }
}

$('geo').onclick = () => {
  if (!navigator.geolocation) { $('geomsg').textContent = 'Localisation indisponible. Choisissez votre quartier.'; return; }
  $('geomsg').textContent = 'Recherche de votre position…';
  navigator.geolocation.getCurrentPosition(
    p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude }; $('quart').value = ''; $('geomsg').textContent = 'Position détectée (précision d’environ ' + Math.round(p.coords.accuracy) + ' m).'; render(); },
    () => { $('geomsg').textContent = 'Localisation refusée ou bloquée. Choisissez votre quartier dans la liste.'; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
};
$('quart').onchange = e => {
  if (e.target.value === '') return;
  const q = Q[+e.target.value];
  pos = { lat: q[1], lng: q[2] };
  $('geomsg').textContent = 'Position : quartier ' + q[0] + '.';
  render();
};
for (const id of ['trade', 'radius', 'now']) $(id).onchange = render;
$('q').oninput = render;

$('send').onclick = () => {
  const n = $('cn').value.trim(), p = $('cp').value.trim();
  if (n.length < 2 || p.length < 6) { $('dmsg').textContent = 'Renseignez votre prénom et votre téléphone.'; return; }
  const R = load('requests');
  R.push({ tech: current.id, name: n, phone: p, msg: $('cm').value, date: new Date().toISOString() });
  save('requests', R);
  $('dmsg').textContent = 'Demande enregistrée pour ' + current.name + '.';
};
$('cancel').onclick = () => $('dlg').close();

$('rgeo').onclick = () => {
  if (!navigator.geolocation) { $('rgeomsg').textContent = 'Localisation indisponible. Le quartier choisi sera utilisé.'; return; }
  navigator.geolocation.getCurrentPosition(
    p => { rpos = { lat: p.coords.latitude, lng: p.coords.longitude }; $('rgeomsg').textContent = 'Position exacte enregistrée.'; },
    () => { $('rgeomsg').textContent = 'Localisation refusée. Le quartier choisi sera utilisé.'; },
    { enableHighAccuracy: true, timeout: 10000 }
  );
};
$('rsave').onclick = () => {
  const name = $('rname').value.trim(), phone = $('rphone').value.trim();
  if (name.length < 2 || phone.length < 6) { $('rmsg').textContent = 'Renseignez votre nom et votre téléphone.'; return; }
  const q = Q[+$('rquart').value];
  const T = load('techs');
  T.push({
    id: 'u' + Date.now(), name, phone, trade: $('rtrade').value, quartier: q[0],
    lat: rpos ? rpos.lat : q[1], lng: rpos ? rpos.lng : q[2],
    price: +$('rprice').value, now: true, tags: $('rtags').value
  });
  save('techs', T);
  $('rmsg').textContent = 'Inscription réussie. Vous apparaissez maintenant dans les recherches.';
  render();
};

function show(reg) {
  $('search').style.display = reg ? 'none' : 'block';
  $('reg').style.display = reg ? 'block' : 'none';
  $('tabS').className = reg ? 'alt' : '';
  $('tabR').className = reg ? '' : 'alt';
}
$('tabS').onclick = () => show(false);
$('tabR').onclick = () => show(true);

pos = { lat: Q[0][1], lng: Q[0][2] };
$('geomsg').textContent = 'Distances calculées depuis le centre-ville. Touchez « Autour de moi » pour utiliser votre position.';
render();
</script>
</body>
</html>
